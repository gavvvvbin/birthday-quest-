body[data-s=spawn] #scrim{opacity:0}
.plate{position:relative;width:100%;margin:12px 0 18px;padding:14px 12px 24px;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(#1e2a50,#111a38);border:4px solid #3a4468;box-shadow:inset 0 0 0 2px #0a1028,inset 0 0 0 4px rgba(255,255,255,.08),0 8px 20px rgba(0,0,0,.45)}
.plate span{font:400 32px/1.15 Neodgm;text-shadow:0 3px 0 #000;min-width:0;word-break:keep-all;text-align:center}
.plate em{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);font:400 16px Neodgm;letter-spacing:.1em;padding:4px 16px;background:#1a2650;border:3px solid #3a4468;white-space:nowrap}
.sm{font:400 16px/1.75 Neodgm;margin:0;text-shadow:0 2px 6px rgba(20,10,60,.9),0 1px 0 #000}
.nd{width:88%;display:flex;gap:12px;align-items:center;text-align:left;padding:12px 16px;background:rgba(14,20,44,.84);border:3px solid #3a4468;outline:1px solid rgba(255,255,255,.14);outline-offset:-4px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.nd .cp{width:46px;height:46px;flex:none;border-radius:50%;background:#2a3050;border:2px solid #5a6488;display:flex;align-items:center;justify-content:center}
.dn{font:400 24px Neodgm;display:flex;align-items:center;gap:6px}
.xp{position:relative}.xp b{position:absolute;left:50%;top:-18px;transform:translateX(-50%);font:400 16px Neodgm;color:#8fe06a;text-shadow:0 2px 0 #000}
.stt{display:flex;justify-content:space-between;margin-bottom:14px}.stt div{display:flex}

body[data-bg=S] #bgS,body[data-bg=L] #bgL{opacity:1}body[data-bg=S] #bg,body[data-bg=L] #bg,body[data-bg=S] #scrim,body[data-bg=L] #scrim{opacity:0}
.tag.lt2{display:flex;align-items:center;gap:10px;text-indent:0;letter-spacing:.2em}
#fl{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.fh{position:absolute;bottom:-40px;animation:up var(--t) linear var(--d) infinite}
@keyframes up{0%{transform:translate(0,0);opacity:0}10%{opacity:.85}50%{transform:translate(16px,-50vh)}90%{opacity:.7}100%{transform:translate(-12px,-105vh);opacity:0}}
.tw{position:absolute;width:4px;height:4px;background:#fff4c2;box-shadow:4px 0 #fff4c2,-4px 0 #fff4c2,0 4px #fff4c2,0 -4px #fff4c2;animation:tw var(--t) ease-in-out var(--d) infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
.pn.lv{border-color:#b9808f;box-shadow:0 10px 26px rgba(0,0,0,.4),0 0 24px rgba(255,150,175,.28)}
.ft{font:400 15px Neodgm;color:#ffd3de;letter-spacing:.08em;text-shadow:0 2px 8px rgba(40,10,50,.9),0 1px 0 #000}
.lvb{animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 2px #d9a0ae,0 8px 16px rgba(0,0,0,.45),0 0 26px rgba(255,160,180,.55)}}
body[data-s=start] #fx{background:radial-gradient(ellipse at 50% 72%,rgba(255,150,175,.3),transparent 58%),linear-gradient(rgba(12,8,44,.4),transparent 30%,transparent 66%,rgba(4,10,18,.5))}
@media(prefers-reduced-motion:reduce){#fl{display:none}.lvb{animation:none}}
button:disabled{pointer-events:none}.bt:disabled{opacity:.45}
.opts{display:flex;flex-direction:column;gap:8px;width:100%}
.opt{font-size:18px!important;justify-content:flex-start;text-align:left;padding:10px 14px;min-height:54px}
.opt b{font:400 18px Neodgm;color:#f0cf7a;width:20px;flex:none}
.opt.no:disabled{opacity:.5;background:linear-gradient(#a84a4a,#6e2a2a)}
.opt.ok:disabled{opacity:1;background:linear-gradient(#4b8c46,#2d5c30);animation:okp .6s}
@keyframes okp{30%{transform:scale(1.04);box-shadow:0 0 28px rgba(143,224,106,.85)}}
.okp{animation:it .4s both}
.chestw{position:relative;width:220px;height:179px;margin:4px auto;flex:none}
.chestw canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.chestw .rays{position:absolute;left:-40px;right:-40px;top:-60px;bottom:-20px;background:repeating-conic-gradient(from 0deg at 50% 55%,rgba(255,226,130,.38) 0 8deg,transparent 8deg 22deg);-webkit-mask-image:radial-gradient(circle at 50% 55%,#000 15%,transparent 68%);mask-image:radial-gradient(circle at 50% 55%,#000 15%,transparent 68%);opacity:0;transition:opacity .6s;animation:spin 14s linear infinite}

function hvHearts(c,now,W,H,u){for(let i=0;i<12;i++){const s=(i*0.618034)%1,t=((now/2800+s*3.7+i/12)%1),pop=Math.min(1,t*5),cs=Math.max(2,Math.round(u*(1.6+s*1.4)*pop)),x=W/2+Math.sin(t*7+i*2.1)*W*.045+(s-.5)*W*.07-cs*3.5,y=H*.5-t*H*.42;c.globalAlpha=Math.max(0,1-t*t*t)*.95;for(let r=0;r<6;r++)for(let q=0;q<7;q++)if(HEART[r][q]==='1'){c.fillStyle=(r===1&&q===1)?"#ffe3ec":(r>=4?"#e04f7d":"#ff6f9c");c.fillRect(Math.round(x+q*cs),Math.round(y+r*cs),cs,cs)}}c.globalAlpha=1}

fin:()=>`${hero(1)}<div class=vf style="margin-top:8px">ALL MISSIONS COMPLETE</div>${plate("g","ALL CLEAR","MISSION COMPLETE")}<p class=sm>모든 미션이 종료되었습니다.<br>${qesc(CFG.PLAYER)}의 첫 번째 모험이<br>완전히 저장되었습니다.</p><div class=ig style="grid-template-columns:repeat(2,1fr)">${[["chest","NPC TRIAL"],["snow","HOWLING ABYSS"],["key","BEST FAN"],["mic","KARAOKE STAR"]].map((a,i)=>`<div class=it style="--d:${i*.3}s;flex-direction:column;text-align:center">${ico(a[0],48)}<b style="font-size:11px">${a[1]}</b></div>`).join("")}</div><p class=sm style="margin-top:6px">수고했어요 내 싸랑 ㅋ.ㅋ ♡♥</p>`,
rift:()=>{if(F.lolDone)return `<div class=sp></div><div class=vf>SUMMONER’S RIFT CLEARED!</div><p class=msg style="font-size:22px">챔피언 발견에 성공했습니다.</p><div class="pn gd"><div class=lb>ACHIEVEMENT UNLOCKED</div><div class=h1>CHAMPION HUNTER</div></div><div class=sp></div><button class=bt onclick="go('q003')"><span>NEXT QUEST</span><em>›</em></button>`;
const nm=CFG.CHAMPION_NAME;return `${plate("dia","SUMMONER’S RIFT","QUEST 002")}<div class=pn><div class=lb>OBJECTIVE</div><p>게임 속에서 지정된 챔피언을 발견하라!</p><div style="display:flex;gap:12px;align-items:center;margin-top:8px"><div class=champ>${CFG.CHAMPION_IMAGE?`<img src="${qesc(CFG.CHAMPION_IMAGE)}" alt="">`:qesc([...nm][0])}</div><div><div class=lb>TARGET CHAMPION</div><div class=h1>${qesc(nm)}</div></div></div><p style="margin-top:8px;opacity:.85">게임 중 해당 챔피언이 등장하면 스크린샷을 촬영해 제출하세요. 제출 후 직접 확인하고 미션을 완료합니다.</p></div><div class=pn><div class=lb>게임 스크린샷</div><input id=lf hidden type=file accept="image/*" onchange="lolPick(this)"><button class="bt gy" onclick="$('lf').click()">${F.lolSub?"사진 다시 선택":"사진 선택"}</button><img id=pv class=pv hidden alt=""><p class=sn>${F.lolSub?"제출 완료":"아직 제출한 사진이 없습니다."}</p><p class=sn style="opacity:.6">사진은 서버에 업로드되지 않고 이 기기에서 미리보기로만 표시됩니다.</p></div><div class=sp></div>${F.lolSub?`<button class=bt onclick=lolFinish()><span>미션 완료</span></button>`:`<button id=lsub class=bt disabled onclick=lolSubmit()><span>SUBMIT</span></button>`}`},
npcfind:()=>`<div class="pn gd" style="margin-top:6px"><div class=lb>QUEST 002</div><div class=h1>NPC를 찾아라</div></div><p class=msg style="font-size:20px">당신의 다음 목적지에는<br>한 명의 NPC가 기다리고 있습니다.<br>그 NPC는 당신에게 다음 퀘스트를 전달할 것입니다.</p><div class=pn><div class=lb>LOCATION</div><div class=h1>${unk(CFG.OMAKASE_LOCATION)}</div>${CFG.OMAKASE_LOCATION==="미정"?'<p style="font-size:14px;opacity:.8">다음 목적지는 아직 공개되지 않았습니다.</p>':''}</div><div class=sp></div><button class=bt onclick=toNpc()><span>도착했어요 (위치 확인)</span></button>`,
npc:()=>`${plate("h","NPC 발견","LOCATION VERIFIED")}<p class=sm>새로운 NPC의 존재가 감지되었습니다.<br>주변을 탐색하십시오.</p><div class="pn gd"><div class=lb>QUEST 002 · ${CFG.NPC_NAME}</div><p>NPC가 건네준 <b style="color:var(--gold)">${CFG.ITEM.name}</b>을(를) 찍어 인증하라.</p></div><div class=sp></div><input id=ph2 type=file accept="image/*" capture=environment hidden onchange="this.files[0]&&ocrItem(this.files[0])"><button class=bt onclick="$('ph2').click()">${ico(CFG.ITEM.icon,32)}<span>아이템 인증하기</span></button><button class="bt gy" onclick="go('npcmood')">비상 인증 (특별 퀘스트)</button>${DEV?'<button class="bt gy" onclick="verifyItem(0)">DEV: 인증 통과</button>':''}`,
npcmood:()=>`${plate("h","특별 퀘스트","SPECIAL QUEST")}<p class=sm>아이템 인증에 실패했습니다.<br>NPC의 기분을 좋게 만들어<br>직접 승인을 받아야 합니다!</p><div class=pn><div class=lb>NPC MOOD</div><div style="display:flex;gap:6px">${[0,1,2,3,4].map(()=>`<span class=mh style="opacity:.25;transition:opacity .3s">${ico("h",32)}</span>`).join("")}</div><p style="margin-top:8px">${CFG.NPC_NAME}의 기분이 좋아지면 NPC가 직접 승인 버튼을 눌러줍니다.</p></div><div class=sp></div><button class=bt onclick=openApprove()>${ico("key",32)}<span>NPC 승인</span></button><button class="bt gy" onclick="go('npc')">다시 사진 찍기</button>`,
approve:()=>`${plate("key","NPC 승인","NPC ONLY")}<p class=sm>NPC만 아는 승인 코드를 입력하세요.</p><div class=sp></div><div class=pin id=pd>${[0,1,2,3].map(()=>"<div></div>").join("")}</div><div class=sp></div><div class=kp>${[1,2,3,4,5,6,7,8,9,"<",0].map(k=>`<button class="bt gy" onclick="key('${k}')">${k=="<"?"←":k}</button>`).join("")}<button class=bt onclick=enter()>OK</button></div><button class="bt gy" onclick="go('npcmood')">돌아가기</button>`,
itemok:()=>`<div class=sp></div><div class=vf>ITEM VERIFIED</div>${ico(CFG.ITEM.icon,64)}<p class=msg style="font-size:22px">${CFG.ITEM.name} 인증 완료!</p><div class="pn gd"><div class=lb>QUEST 003 UNLOCKED</div><div class=h1>다음 퀘스트</div></div><div class=sp></div><button class=bt onclick="go('q003')"><span>퀘스트 확인하기</span><em>›</em></button>`,
q003:()=>`${plate("map","다음 퀘스트","QUEST 003")}<p class=sm>다음 퀘스트는 아직 공개되지 않았습니다.<br>오늘의 모험은 계속됩니다.</p><div class=sp></div>`
};
render();let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if($("tt"))drawTitle($("tt"))},250)});
</script></body></html>
